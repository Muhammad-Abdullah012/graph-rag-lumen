server {
    listen 8080;
    server_name test.data-style.com;

    client_max_body_size 50M;
    # Serve uploaded documents only; all other routing handled by Traefik
    location /documents/ {
        alias /documents/;
        add_header Cache-Control "public, max-age=3600";
    }

    # Explicitly block other paths; Traefik should route elsewhere
    location / {
        return 404;
    }
}
