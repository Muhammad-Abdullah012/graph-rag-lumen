services:
  neo4j:
    image: neo4j:5.26.1-enterprise
    env_file:
      - ./.env.neo
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "8475:7474"
      - "8688:7687"

    healthcheck:
      test: ["CMD", "wget", "--verbose", "--tries=1", "--spider", "localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - graph-rag-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./documents:/documents
      - ./logs:/app/logs
    ports:
      - "9000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    gpus: all
    networks:
      - graph-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - graph-rag-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./documents:/documents:ro
    ports:
      - "8089:8080"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - graph-rag-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  graph-rag-network:
    driver: bridge

