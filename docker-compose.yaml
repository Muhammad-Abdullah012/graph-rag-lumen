services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphrag-postgres
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag_secret
      POSTGRES_DB: graphrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag -d graphrag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      traefik-net:
        aliases:
          - postgres-graphrag

  neo4j:
    image: neo4j:5.26.1-enterprise
    container_name: graphrag-neo4j
    env_file:
      - ./.env.neo
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "8474:7474"
      - "8687:7687"
    environment:
      - NEO4J_PLUGINS=["apoc", "apoc-extended","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_gds_enterprise_license_file=/licenses/neo4j.license
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_AUTH=neo4j/neo4jpassword

    healthcheck:
      test: ["CMD", "wget", "--verbose", "--tries=1", "--spider", "localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      traefik-net:
        aliases:
          - neo4j-graphrag

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./documents:/documents
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./:/app
    ports:
      - "9000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    gpus: all
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - REACT_APP_API_URL=https://test.data-style.com
    ports:
      - "3006:3000"
    volumes:
      - ./:/app
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=false"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./documents:/documents:ro
    ports:
      - "8089:8080"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graphrag.rule=Host(`test.data-style.com`)"
      - "traefik.http.routers.graphrag.entrypoints=websecure"
      - "traefik.http.routers.graphrag.tls=true"
      - "traefik.http.routers.graphrag.tls.certresolver=myresolver"
      - "traefik.http.routers.graphrag.service=graphrag"
      - "traefik.http.services.graphrag.loadbalancer.server.port=8080"
      - "traefik.docker.network=rca-noc-nextjs_traefik-net"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  traefik-net:
    external: true
    name: rca-noc-nextjs_traefik-net


