services:
  neo4j:
    image: neo4j:5.26.1-enterprise
    env_file:
      - ./.env.neo
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "8474:7474"
      - "8687:7687"
    environment:
      - NEO4J_PLUGINS=["apoc", "apoc-extended","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_gds_enterprise_license_file=/licenses/neo4j.license
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_AUTH=neo4j/neo4jpassword

    healthcheck:
      test: ["CMD", "wget", "--verbose", "--tries=1", "--spider", "localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - graph-rag-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - NEO4J_DATABASE=neo4j
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL}
      - OLLAMA_GRAPH_MODEL=${OLLAMA_GRAPH_MODEL}
      - DOCUMENTS_PATH=/documents
      - DOCUMENTS_BASE_URL=http://localhost:8080/documents
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    volumes:
      - ./documents:/documents
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - graph-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - graph-rag-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./documents:/documents:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - graph-rag-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  graph-rag-network:
    driver: bridge

